# PostHog preset: fields, assignments, zones, exports, registries, rules and levels.
# Nothing here is built into hoglint core. The repo root hoglint.toml extends it next to the
# Django pack and adds discovery, `[django]`, providers, the ledger and outputs.
schema = 1

[vocabulary]
edge_kinds = ["drives"]
sections   = ["posthog"]  # the PostHog pack (hoglint.presets_py.posthog): drives

# These decorators make a dataclass: its fields are slots of the class's `__init__`. The house
# `frozen` always makes it frozen; the others do when they pass `frozen=True`.
[discovery]
dataclass_decorators        = ["dataclasses.dataclass", "posthog.dataclasses.frozen", "pydantic.dataclasses.dataclass"]
frozen_dataclass_decorators = ["posthog.dataclasses.frozen"]
# A pydantic model's annotated class attributes are its fields, as a dataclass's are.
dataclass_bases             = ["pydantic.BaseModel", "pydantic.main.BaseModel"]
# A string is a path edge only where the code holds a path: a patch target; the first argument of
# a loader or of one of these, or an element of a list there; a value of a lazy map; any string of
# a file that hands a computed value to one of those; anywhere in a settings module (the Django
# pack names them from `[django] settings`). Elsewhere a string is text, also when it names a
# module. These take a dotted path: an import or a run by name, a URL include, a team extension, a
# Celery task sent by name, `python -m`, and the patch targets of `monkeypatch.setattr`,
# `patch.dict`, `patch.multiple` and two local patch helpers.
path_callees = [
  "import_string", "include", "TeamExtensionDescriptor", "send_task", "subprocess.Popen", "subprocess.run",
  "run_module", "importorskip", "register_assert_rewrite", "set_forkserver_preload",
  "setattr", "patch.dict", "patch.multiple", "_patch", "mock_patch",
]
# Django migration packages: their files get the `migration` context. ClickHouse
# (`posthog/clickhouse/migrations`), async migrations and `posthog/rbac/migrations` are not Django
# migrations and stay prod.
migrations = ["ee/migrations/**", "posthog/migrations/**", "posthog/session/migrations/**", "products/*/backend/migrations/**"]

# The cross-package relation, named once (D97, D105): a first-party destination in another package.
# A third-party end reads no package, so it is no crossing.
[conditions]
crosses-package = "src.package != dst.package and dst.external == none"
# A facade's own code, its fixtures left out.
facade-code = "src.zone == 'facade' and src.zone != 'fixtures'"
# The settings keys request-path does not follow (D103): what they name is not the per-request
# pipeline (middleware, authentication, permissions, throttling, sessions, token validation). Every
# other settings entry is followed, so a key this list lacks adds rows and never hides one.
setting-registers-apps = "edge.setting in ['INSTALLED_APPS', 'CELERY_IMPORTS', 'SHELL_PLUS_POST_IMPORTS']"  # registers apps, task modules and shell imports
setting-mounts-views   = "edge.setting in ['ROOT_URLCONF', 'WSGI_APPLICATION', 'ASGI_APPLICATION']"  # mounts every view; the URL conf and the app entry points
setting-static-files   = "edge.setting == 'STATICFILES_FINDERS'"
setting-api-schema     = "edge.setting == 'SPECTACULAR_SETTINGS' or edge.setting startswith 'SPECTACULAR_SETTINGS.'"  # builds the API schema, not a request
setting-logging        = "edge.setting == 'LOGGING' or edge.setting startswith 'LOGGING.'"
setting-caches         = "edge.setting == 'CACHES' or edge.setting startswith 'CACHES.'"
setting-login-flow     = "edge.setting in ['SOCIAL_AUTH_PIPELINE', 'AXES_LOCKOUT_CALLABLE']"  # a login flow behind a URL, not the per-request pipeline
# The warehouse sources tree: a package per vendor, the SDK they share and the tree's conftest (its
# members, `source_vendor`), under the tree's own package.
in-sources-tree = "dst.path startswith 'products/warehouse_sources/sources/'"
sources-member  = "src.source_vendor != none"

# ── Fields ─────────────────────────────────────────────────────
# required_on is the field's domain: inside it a missing value is unknown, outside it a known none.

[fields]
package   = { type = "id", required_on = ["**"] }
tier      = { type = "enum", values = ["core", "product", "leaf", "tool"], required_on = ["**"] }
role      = { type = "enum", values = ["foundation", "feature"], required_on = ["products/**"] }
zone      = { type = "zone" }
owners    = { type = "set" }
stage     = { type = "enum", values = ["proto-product"] }
django    = { type = "ordered", values = ["settings", "framework", "orm"] }
testcode  = { type = "bool" }
database  = { type = "string", on = "symbol", required_on = "kind == 'model'" }
generated = { type = "bool", required_on = ["posthog/schema.py", "posthog/schema_enums.py"] }
producer  = { type = "set" }
# Frozen history outside the `migration` context: migration files nobody rewrites.
history   = { type = "bool" }
# Django settings modules: they must name product paths (installed apps, middleware, loggers).
settings  = { type = "bool" }
# The wiring channel (products/architecture.md, "Wiring couplings"): a product's wiring locations,
# and the core registration points that name them to register them.
wiring    = { type = "enum", values = ["location", "registration"] }
# Interfaces the old boundary config (tach.toml, `isolation:permanent-interface`) declares permanent:
# core reaches them past the facade by design, and the contract-check inputs watch them.
permanent = { type = "bool" }
crosses   = { type = "bool", on = "symbol" }
# A core module the request pipeline starts from that no setting names: the class every API view inherits.
request_seed = { type = "bool" }
# The member of the warehouse sources tree a module belongs to: a vendor, `sdk` or `conftest`.
source_vendor = { type = "string" }
# A product's AppConfig module: Django imports it at setup in every process.
app_config = { type = "bool" }
# A wiring location core runs by a name it reads at run time (a Celery task, a Temporal workflow, a
# Max tool), a channel no producer reads: the contract-check inputs watch it while it exists.
runs_by_name = { type = "bool" }

# Owners of a finding come from `owners`; cycles and compare's new pairs are between packages.
[roles]
owner = "owners"
group = "package"

# ── Products ───────────────────────────────────────────────────

[[assign]]
match = "products/{product}/**"
set   = { package = "{product}", tier = "product", role = "feature" }

# Foundation products others build on. They never depend on feature products.
[[assign]]
match    = ["products/access_control/**", "products/notifications/**", "products/event_definitions/**"]
set      = { role = "foundation" }
override = true

# Product code that still lives outside products/ keeps its product id (B12).
[[assign]]
match    = "posthog/temporal/ai_observability/**"
set      = { package = "ai_observability", tier = "product", role = "feature" }
override = true

# ── Core, named core packages, leaves ──────────────────────────

[[assign]]
match = ["posthog/**", "ee/**", "common/**"]
set   = { package = "core", tier = "core" }

[[assign]]
match    = "posthog/{infra}/**"
only     = { infra = ["egress", "ingress", "kafka_client", "personhog_client"] }
set      = { package = "{infra}", zone = "infrastructure" }
override = true

[[assign]]
match    = "posthog/clickhouse/client/**"
set      = { package = "clickhouse_client", zone = "infrastructure" }
override = true

[[assign]]
match = ["common/**", "posthog/db_backends/**", "posthog/redis.py", "posthog/cache_utils.py"]
set   = { zone = "infrastructure" }

[[assign]]
match    = "ee/billing/**"
set      = { package = "billing", stage = "proto-product" }
override = true

[[assign]]
match    = "posthog/session_recordings/**"
set      = { package = "session_recordings", stage = "proto-product" }
override = true

[[assign]]
match    = "ee/hogai/**"
set      = { package = "hogai", stage = "proto-product" }
override = true

[[assign]]
match = ["posthog/egress/**", "posthog/kafka_client/**"]
set   = { django = "framework" }

# Core wires products in through registration.
[[assign]]
match = [
  "posthog/api/__init__.py", "posthog/api/rest_router.py", "posthog/urls.py", "posthog/ee_urls.py",
  "posthog/product_urls.py", "posthog/products.py", "posthog/apps.py", "posthog/settings/**",
]
set = { zone = "composition" }

[[assign]]
match = ["posthog/settings/**", "ee/settings.py"]
set   = { settings = true }

[[assign]]
match = "posthog/api/routing.py"
set   = { request_seed = true }

[[assign]]
match = [
  "products/*/backend/temporal/**", "products/*/backend/hogql_queries/**", "products/*/backend/max_tools.py",
  "products/*/backend/max_tools/**", "products/*/backend/tasks.py", "products/*/backend/tasks/**",
  "posthog/temporal/ai_observability/**",
]
set = { wiring = "location" }

# Query runners are not here: core runs them by the query's kind, which `drives` reads.
[[assign]]
match = [
  "products/*/backend/temporal/**", "products/*/backend/max_tools.py", "products/*/backend/max_tools/**",
  "products/*/backend/tasks.py", "products/*/backend/tasks/**",
]
set = { runs_by_name = true }

[[assign]]
match = "products/*/backend/apps.py"
set   = { app_config = true }

[[assign]]
match = [
  "posthog/management/commands/start_temporal_worker.py", "posthog/management/commands/execute_temporal_workflow.py",
  "posthog/management/commands/start_temporal_workflow.py", "posthog/temporal/schedule.py",
  "posthog/temporal/common/worker.py", "posthog/temporal/ai/__init__.py", "posthog/temporal/health_checks/registry.py",
  "posthog/hogql_queries/query_runner.py", "posthog/tasks/scheduled.py", "posthog/apps.py",
  "ee/hogai/core/agent_modes/presets/**",
]
set = { wiring = "registration" }

[[assign]]
match = [
  "products/error_tracking/backend/sql.py", "products/error_tracking/backend/sql/**",
  "products/error_tracking/backend/embedding.py", "products/error_tracking/backend/embedding/**",
  "products/error_tracking/backend/indexed_embedding.py", "products/error_tracking/backend/indexed_embedding/**",
  "products/batch_exports/backend/sql.py", "products/batch_exports/backend/sql/**",
  "products/warehouse_sources/backend/models/**",
  "products/warehouse_sources/backend/temporal/data_imports/sources/common/**",
  "products/warehouse_sources/backend/temporal/data_imports/sources/generated_configs/postgres.py",
  "products/warehouse_sources/backend/temporal/data_imports/sources/google_search_console/**",
  "products/warehouse_sources/backend/temporal/data_imports/sources/mysql/**",
  "products/warehouse_sources/backend/temporal/data_imports/sources/postgres/**",
  "products/warehouse_sources/backend/temporal/data_imports/sources/redshift/**",
  "products/warehouse_sources/backend/temporal/data_imports/sources/salesforce/**",
  "products/warehouse_sources/backend/temporal/data_imports/sources/snowflake/**",
  "products/warehouse_sources/backend/temporal/data_imports/sources/stripe/**",
]
set = { permanent = true }

# Every package under packages/ is a leaf (B13).
[[assign]]
match = "packages/{pkg}/**"
set   = { package = "{pkg}", tier = "leaf" }

[[assign]]
match = "products/warehouse_sources/sources/{vendor}/**"
set   = { source_vendor = "{vendor}" }

[[assign]]
match = "products/warehouse_sources/sources/conftest.py"
set   = { source_vendor = "conftest" }

# ClickHouse migrations are frozen history, but no Django migrations: they keep the prod context.
[[assign]]
match = "posthog/clickhouse/migrations/**"
set   = { history = true }

[[assign]]
match = ["**/tests/**", "**/test/**", "**/test_*.py", "**/conftest.py"]
set   = { testcode = true }

# The core models a contract may name (D65, D98): read by the facade signatures and the contract
# shape alike, so the verdict does not depend on how deep a model sits.
[[assign]]
symbols = { names = [
  "posthog.models.organization.Organization", "posthog.models.organization.OrganizationMembership",
  "posthog.models.project.Project", "posthog.models.team.team.Team", "posthog.models.user.User",
] }
set     = { crosses = true }

# Test support and dev tooling outside a test path: it never ships, so it may import test code, and a
# dev command is no entrypoint thin-commands guards.
# `facade/testing.py` is the fixture surface architecture.md names.
[[assign]]
match = [
  "products/*/backend/facade/testing.py",
  "products/warehouse_sources/backend/facade/_access_control_base.py",
  "products/warehouse_sources/sources/sdk/testing.py",
  "posthog/management/commands/setup_test_environment.py",
  "posthog/management/commands/reset_test_clickhouse_db.py",
  "products/signals/eval/**",
  "posthog/hogql/scripts/**",
  # Dev seeders, demo and smoke commands, each by name: a new one needs a reviewed line here.
  "products/aeo/backend/management/commands/seed_aeo_prompts.py",
  "products/customer_analytics/backend/management/commands/seed_customer_analytics_accounts.py",
  "products/engineering_analytics/backend/management/commands/seed_engineering_analytics.py",
  "products/knowledge_writer/backend/management/commands/knowledge_writer_pr_smoke.py",
  "products/mcp_analytics/backend/management/commands/seed_mcp_sessions.py",
  "products/signals/backend/management/commands/seed_inbox_data.py",
  "products/signals/backend/management/commands/seed_refund_test_data.py",
  "products/tasks/backend/management/commands/bake_dev_stack_image.py",
  "products/tasks/backend/management/commands/demo_mts_example.py",
  "products/visual_review/backend/management/commands/seed_dummy_runs.py",
  "products/visual_review/backend/management/commands/seed_snapshot_history.py",
  "products/web_analytics/backend/management/commands/generate_aeo_content.py",
]
set   = { testcode = true }

# Every first-party folder no other assignment claims is its own package; services/ and tools/
# hold separate deployables, one package per second-level folder (D105). The folders are named,
# so a file in a new top folder reads unknown and a cross-package rule cannot pass it silently.
[[assign]]
match = "{top}/**"
only  = { top = ["bin", "frontend", "livestream", "nodejs", "rust"] }
set   = { package = "{top}", tier = "tool" }

[[assign]]
match = "services/{name}/**"
set   = { package = "services-{name}", tier = "tool" }

[[assign]]
match = "services/*"
set   = { package = "services", tier = "tool" }

[[assign]]
match = "tools/{name}/**"
set   = { package = "tools-{name}", tier = "tool" }

[[assign]]
match = "tools/*"
set   = { package = "tools", tier = "tool" }

[[assign]]
match = "*"
set   = { package = "root", tier = "tool" }

# ── Zones inside a product ─────────────────────────────────────
# A product file no zone path matches lands in the default private zone `internal`.

[zones]
within         = "products/{product}"
default        = "internal"
composition    = {}
infrastructure = {}
backend        = { paths = ["backend/**"] }
facade         = { parent = "backend", paths = ["backend/facade/**"] }
contracts      = { parent = "facade", paths = ["backend/facade/contracts.py", "backend/facade/enums.py"] }
# A capability submodule hands out wiring and holds no body. These names always are one; `api*.py`
# holds the data capabilities and never is one. Both apply at the top of the facade only.
capability     = { parent = "facade", paths = [
  "backend/facade/dags.py", "backend/facade/hogql.py", "backend/facade/max_tools.py", "backend/facade/models.py",
  "backend/facade/queries.py", "backend/facade/tasks.py", "backend/facade/temporal.py",
] }
data-api       = { parent = "facade", paths = ["backend/facade/api*.py"] }
fixtures       = { parent = "facade", paths = ["backend/facade/testing.py"] }
# Where core runs a product's code: what a facade module hands out from here makes it a capability.
wiring         = { parent = "backend", paths = ["backend/hogql_queries/**", "backend/max_tools.py", "backend/temporal/**", "backend/tasks.py"] }
presentation   = { parent = "backend", paths = ["backend/presentation/**", "backend/routes.py"] }
# Viewsets that have not moved to presentation/ yet.
api            = { parent = "backend", paths = ["backend/api/**", "backend/api.py"] }
logic          = { parent = "backend", paths = ["backend/logic.py", "backend/logic/**"] }
models         = { parent = "backend", paths = ["backend/models.py", "backend/models/**"] }
migrations     = { parent = "backend", paths = ["backend/migrations/**"] }
tasks          = { parent = "backend", paths = ["backend/tasks/**"] }
commands       = { parent = "backend", paths = ["backend/management/commands/**"] }
tests          = { paths = ["**/tests/**", "**/test/**", "**/test_*.py"], override = true }

# ── Kinds and shapes ───────────────────────────────────────────
# `model` reads the Django pack's model index, which already handles abstract and proxy models.
# It is `expected`: zero models means the pack read nothing, so every rule about models goes incomplete.

[kinds]
model    = { decl = "model", abstract = false, expected = true }
manager  = { subclass_of = ["django.db.models.manager.BaseManager", "django.db.models.manager.Manager", "django.db.models.Manager"] }
queryset = { subclass_of = ["django.db.models.query.QuerySet", "django.db.models.QuerySet"] }
command  = { subclass_of = ["django.core.management.base.BaseCommand"] }
# Contract types besides frozen dataclasses and enums: core's query syntax tree, and pydantic models.
hogql_ast = { subclass_of = ["posthog.hogql.base.AST"] }
pydantic  = { subclass_of = ["pydantic.BaseModel", "pydantic.main.BaseModel", "pydantic.RootModel", "pydantic.root_model.RootModel"] }

# A contract's signatures are part of it: an unannotated slot is unknown, and the slots of what a
# facade hands out from elsewhere count as the facade's.
[shapes.contract]
data       = ["frozen-dataclass", "enum"]
allow      = ["protocol", "hogql_ast", "exception", "pydantic"]
allow_where = "crosses == true"
# Core's own types (its syntax tree, its Protocols) are core's contract: allowed as they stand.
walk_where = "tier != 'core'"
behavior   = { kind = "abc", where = "tier == 'core'" }
deny       = ["model", "manager", "queryset", "command"]
unknown    = "error"
signatures = true

# Registration modules and presentation adapters hand out classes, never ORM types.
[shapes.registration]
allow   = ["class"]
deny    = ["model", "manager", "queryset"]
unknown = "error"

# ── Exports: the only public surface of a product ──────────────

[exports.facade]
within   = "products/{product}"
paths    = ["backend/facade/**"]
audience = "*"
shape    = "contract"

[exports.registration]
within   = "products/{product}"
paths    = ["backend/routes.py", "backend/webhook_consumers.py", "backend/data_freshness.py", "backend/scopes.py"]
audience = "src.zone == 'composition' or src.registry != none"
shape    = "registration"

# Presentation adapters by base class, with an audience (agreed Nov 9).
[exports.presentation-adapter]
within      = "products/{product}"
paths       = ["backend/presentation/**"]
subclass_of = [
  "products.access_control.backend.presentation.access_control.AccessControlViewSetMixin",
  "products.access_control.backend.presentation.access_control.UserAccessControlSerializerMixin",
  "products.access_control.backend.presentation.access_control_settings.AccessControlSettingsViewSetMixin",
  "products.access_control.backend.presentation.access_control_organization_members.OrganizationMemberProjectAccessViewSetMixin",
  "products.access_control.backend.presentation.role.RestrictedMemberVisibilityMixin",
]
audience    = "src.zone == 'presentation' or src.tier == 'core'"
shape       = "registration"

# The same five mixins by name, for viewsets that have not moved to presentation/ yet. By name, so
# a class that inherits a mixin gets no door to them.
[exports.access-control-mixins]
within   = "products/{product}"
paths    = ["backend/presentation/**"]
symbols  = [
  "products.access_control.backend.presentation.access_control.AccessControlViewSetMixin",
  "products.access_control.backend.presentation.access_control.UserAccessControlSerializerMixin",
  "products.access_control.backend.presentation.access_control_settings.AccessControlSettingsViewSetMixin",
  "products.access_control.backend.presentation.access_control_organization_members.OrganizationMemberProjectAccessViewSetMixin",
  "products.access_control.backend.presentation.role.RestrictedMemberVisibilityMixin",
]
audience = "src.zone == 'api'"
shape    = "registration"

# ── Registries: core finds product code by file convention ─────

[registries.routes]
loader    = "posthog.products.load_product_modules"
module    = "products/{product}/backend/routes.py"
attribute = "register_routes"
lifecycle = "setup"

[registries.data_freshness]
loader    = "posthog.products.load_product_modules"
module    = "products/{product}/backend/data_freshness.py"
attribute = "DATA_SOURCES"
lifecycle = "on-demand"

[registries.scopes]
loader    = "posthog.products.load_product_modules"
module    = "products/{product}/backend/scopes.py"
attribute = "SCOPE_DOCS"
lifecycle = "on-demand"

[registries.webhook_consumers]
loader    = "posthog.products.load_product_modules"
module    = "products/{product}/backend/webhook_consumers.py"
attribute = "WEBHOOK_CONSUMERS"
shape     = "abc:posthog.ingress.contracts.WebhookConsumer"
lifecycle = "first-request"

[registries.health_checks]
loader    = "posthog.products.load_product_modules"
module    = "products/{product}/backend/health_checks.py"
attribute = "HEALTH_CHECKS"
shape     = "abc:posthog.temporal.health_checks.framework.HealthCheckRegistration"
lifecycle = "worker-start"

[registries.integration_usages]
loader    = "posthog.products.load_product_modules"
module    = "products/{product}/backend/integration_usages.py"
attribute = "integration_usages"
lifecycle = "on-demand"

[registries.integration_hooks]
loader    = "posthog.products.load_product_modules"
module    = "products/{product}/backend/integration_hooks.py"
attribute = "after_integration_saved"
lifecycle = "on-demand"

[registries.today_highlights]
loader    = "posthog.products.load_product_modules"
module    = "products/{product}/backend/facade/today_highlights.py"
attribute = "HIGHLIGHT_SOURCES"
lifecycle = "on-demand"

# ── Identities: ledger columns per rule family ─────────────────

[identities]
crossing                 = ["dst.symbol", "src.module", "edge.label"]
relation                 = ["dst.symbol", "edge.declaring_model", "edge.field", "edge.accessor"]
migration-pair           = ["edge.child", "edge.parent"]
facade-slot              = ["src.module", "edge.callable", "edge.slot", "dst.symbol"]
receiver-sender          = ["dst.symbol", "src.package", "src.module"]
location-module-trigger  = ["edge.location", "src.module", "edge.label"]
package-module           = ["src.package", "src.module"]
package-file             = ["package", "subject"]

# ── The public surface ─────────────────────────────────────────

[rules.public-surface]
primitive     = "entrypoint"
doc           = "Other packages name a product only through an export whose audience includes them. A later use of an imported name is judged once, at its import. Migrations are frozen history and are not judged; Django settings may name product paths as strings; a core registration point may name a wiring location; core production code may name a declared permanent interface. A test's patch target is wiring-watched's, not this rule's."
kinds         = ["import", "reference", "dotted-path"]
contexts      = { exclude = ["migration"] }
select        = "crosses-package and dst.tier == 'product' and src.history != true and not (edge.kind == 'dotted-path' and 'test' in edge.context)"
endpoint      = "surface"
uses_at_import = true
allow         = "dst.exported or (src.settings == true and edge.kind == 'dotted-path') or (src.wiring == 'registration' and dst.wiring == 'location') or (dst.permanent == true and src.tier == 'core' and 'test' not in edge.context)"
on_unresolved = "finding"
identity      = ["dst.symbol", "src.module", "edge.kind"]
growth_key    = ["dst.symbol", "edge.kind", "src.package"]

[rules.export-shape]
primitive  = "export"
from       = "src.zone != 'fixtures'"
leave_slots_to = ["facade-signature"]
doc        = "An export hands out only its shape policy: no model, manager, queryset or command, also not inside a field, a base or a re-export. A model or an unknown type in a slot whose row facade-signature reads (a public callable of a facade module, or the copy a facade holds of a function or a data shape's fields it hands out) is facade-signature's to report; every other slot is judged here, also a member of a class handed out from outside the facade."
identity   = "module-symbol"
growth_key = ["dst.symbol", "edge.label", "src.package"]

[rules.facade-signature]
primitive  = "signature"
doc        = "A public facade function neither accepts nor returns a model, manager, queryset or command. Any, object and a bare dict are unknown; a mapping with type arguments is typed, and Any or object as a mapping's argument is an opaque payload in a parameter or a field, never in a return value."
select     = "facade-code and not (dst.symbol in ['builtins.dict', 'typing.Dict'] and edge.subscripted == '1') and not (dst.symbol in ['typing.Any', 'builtins.object'] and edge.slot != 'return' and edge.argument_of in ['builtins.dict', 'typing.Dict', 'typing.Mapping', 'typing.MutableMapping', 'collections.abc.Mapping', 'collections.abc.MutableMapping'])"
deny       = "dst.kind in ['model', 'manager', 'queryset', 'command'] or dst.symbol in ['django.db.models.QuerySet', 'django.db.models.Manager']"
on_unknown = "finding"
# A core model on the list (`crosses`) may be taken or returned.
unless     = "dst.crosses == true"
identity   = "facade-slot"
growth_key = ["dst.symbol", "src.package"]

[rules.facade-logic]
primitive  = "edge"
doc        = "A capability submodule of a facade holds no body: each top-level definition there is a re-export or a stub, so the wiring lives where core runs it."
kinds      = ["declares"]
from       = "src.zone == 'capability' or (src.zone == 'facade' and src.zone not in ['contracts', 'data-api', 'fixtures'] and src.handed_zones in ['wiring', 'tasks', 'models', 'migrations'])"
select     = "edge.body == '1' and src.scope == none and dst.name not in ['__getattr__', '__dir__']"
identity   = ["dst.symbol", "src.module"]
growth_key = ["dst.symbol", "src.package"]

# ── Layers inside a product ────────────────────────────────────

[rules.presentation-uses-facade]
primitive  = "edge"
doc        = "Presentation reaches product code through a facade, its own product's presentation or another product's exported adapter; an import is judged where it lands."
view       = "zones"
from       = "src.zone == 'presentation'"
endpoint   = "surface"
deny       = "dst.tier == 'product' and (dst.zone not in ['facade', 'presentation', 'tests'] or (dst.zone == 'presentation' and crosses-package and not dst.exported))"
identity   = "module-pair"
growth_key = ["dst.module", "src.package"]

[rules.facade-no-drf]
primitive  = "edge"
doc        = "A facade stays framework-free: no DRF, no django.http, no presentation. The viewsets and serializers under backend/api/ that have not moved to presentation/ yet count as presentation."
view       = "zones"
from       = "facade-code"
deny       = "dst.external == 'rest_framework' or dst.module startswith 'django.http' or dst.zone in ['presentation', 'api']"
identity   = "module-pair"
growth_key = ["dst.module", "src.package"]

[rules.contracts-no-django]
primitive     = "reach"
doc           = "Importing a contract module runs no Django: no module-level import, direct or through a chain, reaches it. An import inside a function body does not run on import."
view          = "file-imports"
from          = "src.zone == 'contracts'"
deny          = "dst.external == 'django'"
contexts      = { exclude = ["type_only", "test", "function_local"] }
on_unresolved = "incomplete"
identity      = "module-pair"
growth_key    = ["src.module"]

[rules.thin-commands]
primitive  = "edge"
doc        = "A management command reaches its own product through the facade (B2). Dev seeders named as test code are out."
view       = "zones"
from       = "src.zone == 'commands' and src.testcode != true"
deny       = "dst.package == src.package and dst.zone in ['models', 'logic', 'tasks']"
identity   = "module-pair"
growth_key = ["dst.module", "src.package"]

[rules.atomic-outside-views]
primitive   = "use-shape"
doc         = "Views do not open transactions (B10); counted per function."
kinds       = ["reference"]
select      = "src.zone == 'presentation' and dst.symbol == 'django.db.transaction.atomic'"
deny_shapes = ["call", "with", "decorator"]
identity    = "scope-symbol"
counted     = true
growth_key  = ["dst.symbol", "edge.label", "src.package"]

[rules.prod-imports-test]
primitive  = "edge"
doc        = "Production code never imports test code; test support and dev tooling that never ship count as test code."
kinds      = ["import", "dotted-path"]
contexts   = { exclude = ["test"] }
from       = "src.testcode != true"
deny       = "dst.testcode == true"
identity   = "module-pair"
growth_key = ["dst.module", "src.package"]

# The rules of three import-linter contracts. A rule reads every import, in tests, under
# TYPE_CHECKING and inside functions too, as import-linter does.

[rules.sources-vendors-use-sdk]
primitive  = "edge"
doc        = "A warehouse source vendor takes shared code only from the sources SDK: no core, ee, common or product module outside the sources tree. The SDK may import core and products, its testing module common, the tree's conftest products."
kinds      = ["import"]
contexts   = { exclude = [] }
from       = "sources-member"
endpoint   = "surface"
deny       = "dst.tier in ['core', 'product'] and not in-sources-tree"
unless     = "(src.source_vendor == 'sdk' and not (dst.path startswith 'ee/' or dst.path startswith 'common/')) or (src.module == 'products.warehouse_sources.sources.sdk.testing' and dst.path startswith 'common/') or (src.source_vendor == 'conftest' and dst.path startswith 'products/')"
identity   = "module-pair"
growth_key = ["dst.module", "src.package"]

[rules.sources-vendors-independent]
primitive  = "reach"
doc        = "Warehouse source vendors, the SDK and the tree's conftest do not import each other, directly or through other modules of the sources tree. An import of the SDK is no path: the vendors share it."
view       = "file-imports"
from       = "sources-member"
select     = "in-sources-tree and dst.source_vendor != 'sdk'"
deny       = "dst.source_vendor != none and src.source_vendor != dst.source_vendor"
contexts   = { exclude = [] }
identity   = "module-pair"
growth_key = ["dst.module", "src.package"]

[rules.webhook-consumers-use-facade]
primitive  = "edge"
doc        = "A product's webhook consumers module imports product backend code only through a facade, its own or another product's."
kinds      = ["import"]
contexts   = { exclude = [] }
from       = "src.registry == 'webhook_consumers'"
endpoint   = "surface"
deny       = "dst.zone == 'backend' and dst.zone != 'facade'"
identity   = "module-pair"
growth_key = ["dst.module", "src.package"]

# ── Model crossings, relations, signals, drives ────────────────

[rules.model-crossings]
primitive    = "use-shape"
doc          = "Outside its package, a model appears only in allowed shapes: a type, a cast, value rows, a signal sender, the team-extension registry. Judged at the origin, so a re-export hides nothing."
kinds        = ["reference"]
select       = "dst.kind == 'model' and dst.tier == 'product' and crosses-package and edge.shape != none"
endpoint     = "origin"
allow_shapes = [
  "annotation", "exception", "nested-class-attr", "_meta", "scalar-chain", "subquery", "sender",
  "passed-as-class(cast)", "passed-as-class(get_or_create_team_extension)",
]
contexts     = { exclude = ["test", "migration"] }
flow         = "def-use"
requires     = ["django.uses"]
identity     = "crossing"
counted      = true
growth_key   = ["dst.symbol", "edge.label", "src.package"]

[rules.get-model]
primitive  = "edge"
doc        = "apps.get_model naming another package's model is counted."
kinds      = ["model-label"]
select     = "edge.shape == 'get_model' and dst.tier == 'product' and crosses-package"
contexts   = { exclude = ["test", "migration"] }
# A label held in a variable, or one no model answers for, is an item, not a finding.
on_unresolved = "incomplete"
identity   = "crossing"
counted    = true
growth_key = ["dst.symbol", "edge.label", "src.package"]

[rules.reverse-accessor]
primitive     = "edge"
doc           = "A relation into another package is sealed: hidden, with no explicit query name. Owner by defining module. A third-party app is no package."
kinds         = ["reverse-accessor"]
select        = "crosses-package"
on_unresolved = "block"
identity      = "relation"
growth_key    = ["dst.symbol"]

[rules.receiver-direction]
primitive  = "edge"
doc        = "A product never listens to another product's sender (B6). The ledger keeps the sender. A receiver in a test is no wiring."
kinds      = ["signal"]
select     = "crosses-package and dst.tier == 'product'"
contexts   = { exclude = ["test"] }
# A receiver whose sender hoglint cannot place (none, a variable, a call) is an item, not a finding.
on_unresolved = "incomplete"
identity   = "receiver-sender"
counted    = true
growth_key = ["dst.symbol", "src.package"]

[rules.installs]
primitive     = "edge"
doc           = "A product registers a callback into another package's hook: the approved way to send behavior across a boundary, so a list and not debt. wiring-watched checks that the callback's module is watched; an install whose hook cannot be resolved is incomplete."
kinds         = ["installs"]
select        = "crosses-package"
deny          = "false"
contexts      = { exclude = ["test"] }
on_unresolved = "incomplete"
ledger        = false

[rules.drives]
primitive     = "edge"
doc           = "A test outside a product that executes the product's wiring is recorded."
kinds         = ["drives"]
contexts      = { include = ["test"] }
select        = "crosses-package and edge.execution != 'none'"
resolve_calls = "bare-name"
identity      = "location-module-trigger"
counted       = true
growth_key    = ["edge.location", "edge.label", "src.package"]

# A path string in a settings module is followed whatever function holds it; an import inside a
# function is not.
[rules.request-path]
primitive     = "reach"
doc           = "A product module that core's request pipeline reaches by module-level imports is a watched file (D103): wiring-watched checks it. The search starts at the modules settings name, except under the keys that are not the per-request pipeline, and at the view base class, and goes on through product code. A list, not debt."
kinds         = ["import", "dotted-path"]
from          = "src.settings == true or src.request_seed == true"
select        = "(src.settings == true and edge.kind == 'dotted-path' and not (setting-registers-apps or setting-mounts-views or setting-static-files or setting-api-schema or setting-logging or setting-caches or setting-login-flow)) or (src.settings != true and edge.kind == 'import' and 'function_local' not in edge.context)"
deny          = "dst.tier == 'product'"
through_denied = true
contexts      = { exclude = ["type_only", "test"] }
on_unresolved = "incomplete"
identity      = "module-pair"
growth_key    = ["dst.module"]
report        = "advisory"
ledger        = false

# The covers after the first four are where core runs a product's code with no import a rule
# follows: its models and migrations, a module a registry loads by name, a declared permanent
# interface, a wiring location run by name, a module settings name under any key, and what the
# AppConfig module imports at module level. A location run by name is one row, watched by any one
# watched file in it, as the product lint reads it (the owner, Nov 16).
[rules.wiring-watched]
primitive  = "coverage"
doc        = "Every wiring location another package drives, every product module the request pipeline reaches, every receiver or hook callback outside tests, and every module outside tests patch is in the contract-check inputs; so are a product's models and migrations, the modules a registry loads by name, its permanent interfaces, each wiring location run by name (one watched file in it watches it), the modules settings name, and the product modules its AppConfig module imports at module level."
covers     = [
  "rules.drives.dst.path",
  "rules.request-path.dst.path",
  "edge.kind in ['signal', 'installs'] and 'test' not in edge.context and crosses-package: src",
  "edge.kind == 'dotted-path' and edge.context == 'test' and crosses-package: surface",
  "zone in ['models', 'migrations']: module",
  "registry != none and tier == 'product': module",
  "permanent == true and testcode != true: module",
  "runs_by_name == true and testcode != true: location",
  "edge.kind == 'dotted-path' and src.settings == true and dst.tier == 'product': surface",
  "edge.kind == 'import' and src.app_config == true and dst.package == src.package and 'function_local' not in edge.context and 'type_only' not in edge.context: surface",
]
inputs     = { adapter = "turbo", task = "backend:contract-check" }
identity   = "entity"
growth_key = ["subject"]

# What the Isolated level reads of code outside the products (D108): a product file such code
# reaches past the export is watched, as a request-path file is. A list: public-surface holds the
# crossing as debt.
[rules.reached-watched]
primitive  = "coverage"
doc        = "Every product file that code outside the products, production or test, reaches past the product's export is in the contract-check inputs, so a change there runs the full suite. The Isolated level reads it; public-surface holds the crossing as debt, so this is a list."
covers     = ["edge.kind in ['import', 'reference', 'dotted-path'] and src.tier != 'product' and dst.tier == 'product' and not dst.exported: surface"]
inputs     = { adapter = "turbo", task = "backend:contract-check" }
identity   = "entity"
report     = "advisory"
ledger     = false

[rules.dynamic-imports]
primitive     = "edge"
doc           = "A computed import outside a declared registry loader is unknown: rules that need it go incomplete."
kinds         = ["dynamic-import"]
from          = "src.registry == none"
deny          = "false"
on_unresolved = "incomplete"
ledger        = false

# ── Package graph (replaces tach depends_on) ───────────────────

[rules.no-new-package-cycles]
primitive  = "cycle"
doc        = "No new dependency may close a cycle between products. A sealed FK still points one way (B9)."
view       = "packages"
kinds      = ["import", "reference", "dotted-path", "model-label", "relation"]
select     = "src.tier == 'product' and dst.tier == 'product'"
contexts   = { exclude = ["test", "type_only"] }
identity   = "package-pair"
growth_key = ["src.package", "dst.package"]

[rules.foundation-direction]
primitive  = "edge"
doc        = "Foundation products never depend on feature products."
view       = "packages"
from       = "src.role == 'foundation'"
deny       = "dst.role == 'feature'"
contexts   = { exclude = ["test", "type_only"] }
identity   = "package-pair"
growth_key = ["src.package", "dst.package"]

[rules.infrastructure-direction]
primitive  = "edge"
doc        = "Infrastructure never depends on a product or a proto-product."
kinds      = ["import", "reference", "dotted-path"]
from       = "src.zone == 'infrastructure'"
deny       = "dst.tier == 'product' or dst.stage == 'proto-product'"
contexts   = { exclude = ["test", "type_only"] }
identity   = "package-pair"
growth_key = ["src.package", "dst.package"]

[rules.no-product-lists-in-core]
primitive  = "edge"
doc        = "Core names a product only through a registry or the registration export (B14). Migrations are frozen history and are not judged; Django settings may name product paths as strings; core production code may name a declared permanent interface."
kinds      = ["import", "dotted-path"]
from       = "src.tier == 'core' and src.registry == none and src.history != true"
deny       = "dst.tier == 'product'"
unless     = "(src.zone == 'composition' and dst.exported) or (src.settings == true and edge.kind == 'dotted-path') or dst.permanent == true"
contexts   = { exclude = ["test", "type_only", "migration"] }
identity   = "module-pair"
growth_key = ["dst.module", "src.package"]

[rules.leaves-stay-leaves]
primitive     = "edge"
doc           = "A leaf package (packages/*) ships alone: no app code, no Django, no DRF."
kinds         = ["import"]
from          = "src.tier == 'leaf'"
deny          = "dst.tier in ['core', 'product'] or dst.external in ['django', 'rest_framework']"
contexts      = { exclude = ["test"] }
on_unresolved = "block"
identity      = "module-pair"
growth_key    = ["src.module", "dst.module"]

[rules.orm-independent]
primitive  = "signature"
doc        = "Framework-level core packages use Django, never its models. A slot with no usable type is incomplete, not a finding: the rule is about models, not loose types."
select     = "src.django == 'framework'"
deny       = "dst.kind in ['model', 'manager', 'queryset'] or dst.symbol == 'django.apps.apps.get_model'"
contexts   = { exclude = ["test"] }
on_unknown = "incomplete"
identity   = "facade-slot"
growth_key = ["dst.symbol", "src.package"]

# ── Django invariants ──────────────────────────────────────────

[rules.migration-database]
primitive     = "edge"
doc           = "A migration depends only on migrations that run on the same databases."
kinds         = ["migration-parent"]
require       = "edge.child_databases subset_of edge.parent_databases"
on_unresolved = "block"
identity      = "migration-pair"
growth_key    = ["edge.child", "edge.parent"]

[rules.own-database]
primitive  = "layout"
doc        = "A product model has its own database route (B7). Incomplete until the pack sets `database` on models."
on         = "symbol"
select     = "kind == 'model' and tier == 'product' and database != none"
require    = "database != 'default'"
identity   = "package-file"
growth_key = ["package"]

# ── Layout, registries, generated code ─────────────────────────

[rules.product-code-at-home]
primitive  = "layout"
doc        = "Product code lives under products/ (B12); counted per package, so a new file outside fails."
select     = "tier == 'product' and not path startswith 'products/'"
identity   = "package-file"
growth_key = ["package"]

[rules.has-facade]
primitive = "layout"
doc       = "A product has a facade: a contracts module or package, and an api module that defines a function. The Isolated level asks for it (D108); a list, not debt."
within    = "products/{product}"
files     = ["backend/facade/{contracts.py,contracts}", "backend/facade/api.py: function"]
identity  = "entity"
report    = "advisory"
ledger    = false

[rules.registry-slots]
primitive  = "layout"
doc        = "A file in a registry slot defines the slot's attribute, and its members subclass the slot's base."
registry   = ["routes", "webhook_consumers", "health_checks"]
identity   = "entity"
growth_key = ["subject"]

[rules.generated-producer]
primitive   = "inventory"
doc         = "Each generated file has exactly one producer."
select      = "generated == true"
exactly_one = "producer"
on          = "module"
identity    = "entity"
growth_key  = ["subject"]

[rules.health-checks-no-dags]
primitive = "reach"
doc       = "Health checks never import posthog.dags. The runtime probe stays the authority; this is an early warning."
view      = "file-imports"
from      = "src.registry == 'health_checks'"
deny      = "dst.module startswith 'posthog.dags'"
report    = "advisory"
ledger    = false

# Reviewed exceptions to these rules live in hoglint.exceptions.toml.

# ── Levels ─────────────────────────────────────────────────────
# Isolated is specified apart from lint acceptance (D108). Only what can make the skip miss tests
# blocks, ledgered or not: an unwatched file that code outside the products reaches past the export,
# the product's own presentation past its facade, and unwatched wiring. The product also needs its
# facade. Every other finding is a lint matter only.

[levels.isolated]
doc          = "turbo may skip the full Django suite when only this product changes."
group_by     = "package"
# A product with code under products/, where its facade and its package.json live.
select       = "tier == 'product' and path startswith 'products/'"
requires     = ["reached-watched", "wiring-watched", "presentation-uses-facade", "has-facade"]
strict       = ["reached-watched", "wiring-watched", "presentation-uses-facade", "has-facade"]
# Presentation that reaches another product past its door is lint only.
within_group = ["presentation-uses-facade"]
# A product whose own turbo.json narrows its contract-check inputs claims the level: if it fails
# the level, check fails, and no ledger line accepts it. An unsound skip is never debt.
claimed_by   = { adapter = "turbo", task = "backend:contract-check" }
