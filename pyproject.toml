# One wheel: the hoglint package, the hoglint_native module (binding/) and the hoglint-facts binary.
# Build it with bin/stage-facts, then `maturin build --release --locked`; see .github/workflows/wheels.yml.
[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "hoglint"
version = "0.2.6"
description = "Boundary linter for large Python and Django monorepos, with a Rust engine"
readme = "README.md"
license = { file = "LICENSE" }
# The code imports compression.zstd, which Python 3.14 added.
requires-python = ">=3.14"
authors = [{ name = "PostHog" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Quality Assurance",
]
# Lower bounds only: a repo that pins hoglint resolves these with its own pins.
dependencies = [
    "orjson>=3.11.9",
    "pyyaml>=6.0.3",
]

[project.scripts]
hoglint = "hoglint.cli:entry"

[project.urls]
Repository = "https://github.com/PostHog/hoglint"

[tool.maturin]
manifest-path = "binding/Cargo.toml"
module-name = "hoglint_native"
python-packages = ["hoglint"]
# bin/stage-facts puts the binary under platlib/hoglint/bin/, so it installs next to the package.
data = "wheel-data"
compatibility = "manylinux2014"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.20",
    "ty==0.0.80",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py313"
force-exclude = true
# Keeps hoglint and the test helper modules classified as in the monorepo (isort order).
src = ["src"]
# The model repository is data: its files hold the code shapes the tests check, not hoglint code.
exclude = [".git", "target", "tests/model_repo/repo", "tests/model_repo/site"]

[tool.ruff.lint]
ignore = [
    "B017",
    "B904",
    "B905",
    "C901",
    "E501",
    "E722",
    "E731",
    "F541",
    "UP007",
    "UP032",
    "UP045",
    "UP046",
    "UP047",
    "UP042",
]
select = [
    "B",
    "C4",
    "C9",
    "E",
    "F",
    "I",
    "PLC0415",
    "RUF005",
    "RUF013",
    "RUF015",
    "RUF019",
    "T100",
    "T2",
    "TRY201",
    "TRY400",
    "UP",
    "W",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true
length-sort-straight = true
split-on-trailing-comma = false
section-order = ["future", "standard-library", "testing", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
"testing" = ["pytest", "unittest"]

[tool.ruff.lint.per-file-ignores]
# One lazy import predates this repo; the monorepo exempted the whole tools/ tree.
"hoglint/source.py" = ["PLC0415"]

[tool.ty.src]
include = ["hoglint", "tests"]
exclude = ["tests/model_repo/repo", "tests/model_repo/site"]
