# The hoglint native engine as a Python extension module: the Rust link (../src/link) behind
# a thin PyO3 binding. Built by maturin into abi3 wheels for CPython 3.12 and newer, so a
# developer installs a wheel and needs no Rust toolchain. Local builds: ../bin/build.
[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "hoglint-native"
version = "0.1.0"
requires-python = ">=3.12"

[tool.maturin]
module-name = "hoglint_native"
compatibility = "manylinux2014"
