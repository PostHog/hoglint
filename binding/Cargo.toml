[package]
name = "hoglint-native"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[lib]
name = "hoglint_native"
crate-type = ["cdylib"]

[dependencies]
hoglint-facts = { path = ".." }
pyo3 = { version = "=0.28.3", features = ["extension-module", "abi3-py312", "multiple-pymethods"] }
rayon = "1"
regex = "1"
rusqlite = { version = "0.36", features = ["blob", "bundled"] }
sha1 = "=0.10.6"
sha2 = "=0.10.9"
rustc-hash = "2"
serde_json = { version = "1", features = ["raw_value"] }

[build-dependencies]
pyo3-build-config = "=0.28.3"
