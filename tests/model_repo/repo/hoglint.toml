# The model repository's root config: the monorepo's root config without the owners provider.
schema = 1
extends = ["hoglint:django", "hoglint:posthog", "tools/hoglint/presets/posthog.toml"]

[discovery]
source_roots = ["."]
first_party  = ["posthog", "ee", "common", "products", "tools", "services", "packages", "sandbox"]
exclude      = ["docs/**"]
external     = ["django", "rest_framework", "tokens"]

[django]
settings            = ["posthog.settings", "posthog.settings.*", "ee.settings"]
db_routing          = "products/db_routing.yaml"
db_alias_template   = "{database}_db_writer"
receiver_decorators = ["django.dispatch.dispatcher.receiver", "posthog.models.signals.mutable_receiver"]
oracles             = ["registry", "migration-loader"]
hooks = [
  "posthog.admin.console.registry.actions.register_moved_action",
  "posthog.admin.console.registry.console.register_moved_page",
  "posthog.api.file_system.deletion.register_post_delete_hook",
  "posthog.models.resource_transfer.registered_models.register_model",
  "products.inventory.backend.facade.hooks.register_restock_hook",
]

[posthog]

[ledger]
file       = "hoglint.ledger"
exceptions = "hoglint.exceptions.toml"

# Planted (case WW07): a request seed whose file was moved away; the run reports it, never drops it.
[[assign]]
match = "posthog/api/view_base.py"
set   = { request_seed = true }

# Planted (cases DO01 to DO07): a door for a core package, which public-surface reaches through
# `dst.door`. The preset declares no door outside the products, so the model repository declares
# its own.
[exports.ingress-door]
within   = "posthog/ingress"
paths    = ["contracts.py"]
audience = "*"
shape    = "registration"
