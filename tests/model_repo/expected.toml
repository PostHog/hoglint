# Wanted: verdicts that are decided and not built (or built and not firing) on this preset. Each
# is an expected failure of test_model_repo.py until the rule gives it. A wanted row matches a
# row of `rule` ("*" for any rule) with `verdict` ("*" for any: a finding or an incomplete row)
# whose identity holds every string of `match`.

[[wanted]]
case = "FQ01"
decision = "D95, D96: a facade function runs no ORM query itself"
rule = "*"
verdict = "finding"
match = ["products.catalog.backend.facade.api", "count_entries"]

[[wanted]]
case = "IN02"
decision = "D100: a model class registered into another package is a crossing"
rule = "*"
verdict = "finding"
match = ["products.legacy.backend.models.Widget", "registered_models"]

[[wanted]]
case = "DO01"
decision = "D107: an inbound rule for a core package with a declared door (dst.door)"
rule = "*"
verdict = "finding"
match = ["posthog.ingress.dispatch", "products.legacy.backend.logic.widgets"]

[[wanted]]
case = "AT01"
decision = "B10; Nov 12: the rule gets the edge it needs or goes off"
rule = "atomic-outside-views"
verdict = "finding"
match = ["products.legacy.backend.presentation.views"]

[[wanted]]
case = "RS02"
decision = "registry-slots: a slot file defines the attribute (needs its producer)"
rule = "registry-slots"
verdict = "finding"
match = ["products.legacy.backend.health_checks"]

[[wanted]]
case = "RS03"
decision = "registry-slots: members subclass the base (needs its producer)"
rule = "registry-slots"
verdict = "finding"
match = ["products.legacy.backend.webhook_consumers"]

[[wanted]]
case = "CN03"
decision = "contracts-no-django: a package __init__ that an import runs is followed (known gap, Nov 12)"
rule = "contracts-no-django"
verdict = "finding"
match = ["products.inventory.backend.facade.contracts"]

[[wanted]]
case = "TM02"
decision = "bare list as unknown (open since Nov 12)"
rule = "facade-signature"
verdict = "unknown"
match = ["take_bare_list"]

[[wanted]]
case = "WK04"
decision = "unknown is never clean: a class from a top folder outside first_party is walked or unknown"
rule = "*"
verdict = "*"
match = ["ExternalView", "StockItem"]

[[wanted]]
case = "HZ13"
decision = "Unknown is never clean: a lazy map of bare names where no entry resolves (a written limit, Nov 12)"
rule = "*"
verdict = "*"
match = ["products.legacy.backend.facade.barelazy"]

[[wanted]]
case = "HZ14"
decision = "Unknown is never clean: a lazy value that names the attribute, 'pkg.mod:Name' (a written limit, Nov 12)"
rule = "*"
verdict = "*"
match = ["products.legacy.backend.facade.colonlazy"]

[[wanted]]
case = "ME09"
decision = "A written limit (Nov 13): outside a surface file a bare dict, a bare object and a missing annotation have no row"
rule = "*"
verdict = "unknown"
match = ["products.catalog.backend.facade.notes"]

[[wanted]]
case = "ME10"
decision = "A written limit (Nov 13): a nested class in a surface file's class is read in plain mode"
rule = "*"
verdict = "unknown"
match = ["products.catalog.backend.facade.outlines"]

[[wanted]]
case = "RG01"
decision = "F1, proof round 2: a model in a slot of a function routes.py takes in by import is reported by no rule (measured, open)"
rule = "export-shape"
verdict = "finding"
match = ["products.legacy.backend.models.Widget", "products.legacy.backend.routes"]

[[wanted]]
case = "ES21"
decision = "A written limit (T14, Nov 13): a metaclass given by a call is not read"
rule = "export-shape"
verdict = "unknown"
match = ["products.catalog.backend.facade.bases.EntryStale", "export-unknown"]

