[package]
name = "hoglint-facts"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[workspace]
members = [".", "binding"]

[lib]
name = "hoglint_facts"
path = "src/lib.rs"

[[bin]]
name = "hoglint-facts"
path = "src/main.rs"

[dependencies]
ruff_python_parser = "=0.0.20"
ruff_python_ast = "=0.0.20"
ruff_text_size = "=0.0.20"
rayon = "1"
regex = "1"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "=0.10.9"

[build-dependencies]
sha2 = "=0.10.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
